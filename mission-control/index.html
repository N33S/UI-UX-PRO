<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control</title>
<meta name="description" content="Opgaver og mål for AI-receptionisten. Hurtig som en note.">
<meta name="theme-color" content="#05070D">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column mission console, fixed header + bottom tab bar, glass panels on a faint grid. Single dark look by design. */
:root{
  --bg:#05070D;
  --bg-2:#0A0F1C;
  --glass:rgba(16,24,42,.55);
  --glass-strong:rgba(18,28,50,.82);
  --line:rgba(0,229,255,.16);
  --line-strong:rgba(0,229,255,.38);
  --grid:rgba(0,229,255,.045);
  --fg:#E6F1FF;
  --muted:#8C9BB5;
  --dim:#5D6B85;
  --cyan:#00E5FF;
  --cyan-soft:rgba(0,229,255,.14);
  --violet:#8B5CF6;
  --violet-soft:rgba(139,92,246,.18);
  --orange:#FF8A3D;
  --orange-soft:rgba(255,138,61,.14);
  --on-cyan:#021016;
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px;
  --r-sm:12px;
  --gutter:16px;
  --tab-h:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --t-fast:140ms;
  --t-med:260ms;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%;background:var(--bg);overflow-x:clip}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:clip;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% -10%,rgba(0,229,255,.10),transparent 60%),
    radial-gradient(80% 50% at 100% 100%,rgba(139,92,246,.08),transparent 60%),
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,
    var(--bg);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--gutter) 10px;
  background:linear-gradient(to bottom,rgba(5,7,13,.92),rgba(5,7,13,.72));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:.18em;font-weight:700}
.live{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);position:relative}
.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--cyan);animation:ping 2.4s var(--ease) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(2.8);opacity:0}}
.stamp{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

/* ---------- layout ---------- */
main{max-width:640px;margin:0 auto;padding:16px var(--gutter) calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 28px)}
.screen{display:flex;flex-direction:column;gap:16px}
.screen[hidden]{display:none}
.panel{
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 0 1px rgba(0,229,255,.02),0 10px 30px -18px rgba(0,229,255,.25);
  padding:16px;position:relative;
}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.eyebrow b{color:var(--cyan);font-weight:500}
h1,h2{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:22px;letter-spacing:-.01em}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:4px}
.title-row .count{font-family:var(--mono);font-size:13px;color:var(--muted)}

/* ---------- capture input ---------- */
.capture{position:relative}
.capture input{
  width:100%;height:56px;padding:0 56px 0 46px;border-radius:var(--r);
  background:var(--glass-strong);border:1px solid var(--line-strong);font-size:17px;
  box-shadow:0 0 0 0 rgba(0,229,255,0);transition:box-shadow var(--t-med) var(--ease),border-color var(--t-med);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
.capture input::placeholder{color:var(--dim)}
.capture input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft),0 0 24px -6px rgba(0,229,255,.5)}
.capture .prompt{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-family:var(--mono);color:var(--cyan);font-size:18px;font-weight:700;pointer-events:none;text-shadow:0 0 8px rgba(0,229,255,.7);z-index:1}
.capture .go{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--cyan);color:var(--on-cyan);transition:transform var(--t-fast),opacity var(--t-fast)}
.capture .go:active{transform:scale(.94)}
.capture input:placeholder-shown + .go{opacity:.35}
.hint{font-family:var(--mono);font-size:12px;color:var(--dim);padding:8px 4px 0;display:flex;flex-wrap:wrap;gap:4px 14px}
.hint span b{color:var(--muted);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;margin:0 calc(var(--gutter) * -1);padding-inline:var(--gutter)}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(10,15,28,.6);
  font-family:var(--mono);font-size:13px;color:var(--muted);transition:border-color var(--t-fast),color var(--t-fast),background var(--t-fast);
}
.chip:active{background:var(--violet-soft);border-color:var(--violet);color:var(--fg)}

/* ---------- ring ---------- */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 16px 18px;overflow:hidden}
.ring-wrap{position:relative;width:min(232px,68vw);aspect-ratio:1;max-width:100%}
.ring-wrap svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:rgba(0,229,255,.10);stroke-width:10}
.ring-bar{fill:none;stroke:url(#ringGrad);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 900ms var(--ease);filter:drop-shadow(0 0 6px rgba(0,229,255,.75)) drop-shadow(0 0 16px rgba(0,229,255,.35))}
.ring-tick{stroke:rgba(230,241,255,.35);stroke-width:2}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.ring-val{font-family:var(--mono);font-size:clamp(40px,13vw,56px);font-weight:700;line-height:1;letter-spacing:-.04em;text-shadow:0 0 18px rgba(0,229,255,.55)}
.ring-val small{font-size:.5em;color:var(--muted);font-weight:500;text-shadow:none}
.ring-pct{font-family:var(--mono);font-size:12px;color:var(--cyan);letter-spacing:.14em;margin-top:6px}
.hero-name{font-size:20px;font-weight:600;text-align:center}
.hero-meta{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-align:center}
.stepper{display:flex;gap:12px;align-items:center}
.step{
  width:56px;height:48px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line-strong);
  background:rgba(0,229,255,.06);color:var(--cyan);transition:transform var(--t-fast),background var(--t-fast),box-shadow var(--t-fast);
}
.step:active{transform:scale(.94);background:var(--cyan-soft);box-shadow:0 0 18px -4px var(--cyan)}
.step.minus{color:var(--muted);border-color:var(--line)}
.step.sm{width:44px;height:44px;border-radius:12px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px;border-radius:var(--r-sm);background:rgba(10,15,28,.55);border:1px solid var(--line);min-width:0}
.stat .n{font-family:var(--mono);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.stat.warn{border-color:rgba(255,138,61,.45);background:var(--orange-soft)}
.stat.warn .n{color:var(--orange);text-shadow:0 0 12px rgba(255,138,61,.5)}

/* ---------- tasks ---------- */
.group{display:flex;flex-direction:column;gap:6px}
.group-head{display:flex;align-items:center;gap:10px;padding:6px 4px 2px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.group-head::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--violet);box-shadow:0 0 8px var(--violet)}
.group-head.inbox::before{background:var(--dim);box-shadow:none}
.group-head .c{margin-left:auto;color:var(--dim)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{position:relative;border-radius:var(--r-sm);overflow:hidden;touch-action:pan-y}
.task-del{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:20px;background:var(--orange-soft);color:var(--orange);font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:var(--r-sm);opacity:0;transition:opacity var(--t-fast)}
.task.dragging .task-del,.task.swiped .task-del{opacity:1}
.task-in{
  position:relative;display:flex;align-items:center;gap:4px;min-height:56px;padding:4px 4px 4px 4px;
  background:var(--glass-strong);border:1px solid var(--line);border-radius:var(--r-sm);
  transition:transform var(--t-med) var(--ease),border-color var(--t-fast),background var(--t-fast);
  -webkit-user-select:none;user-select:none;
}
.task.dragging .task-in{transition:none}
.task.pressing .task-in{background:rgba(24,36,64,.9)}
.task.overdue .task-in{border-color:rgba(255,138,61,.55);box-shadow:inset 3px 0 0 var(--orange),0 0 18px -10px var(--orange)}
.check,.star{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px}
.check .c{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);transition:all var(--t-fast);display:grid;place-items:center;color:transparent}
.check:active .c{transform:scale(.9)}
.check:hover .c{border-color:var(--cyan)}
.task.done .check .c,.task.closing .check .c{background:var(--cyan);border-color:var(--cyan);color:var(--on-cyan);box-shadow:0 0 12px var(--cyan)}
.body{flex:1;min-width:0;padding:8px 4px;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.body .txt{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.task.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.meta:empty{display:none}
.meta .proj{color:#B9A2FF}
.meta .due.over{color:var(--orange)}
.meta .due.today{color:var(--cyan)}
.star{color:var(--dim);transition:color var(--t-fast),transform var(--t-fast)}
.star:active{transform:scale(.88)}
.star[aria-pressed="true"]{color:var(--cyan);filter:drop-shadow(0 0 6px rgba(0,229,255,.7))}
.star[aria-pressed="true"] path{fill:currentColor}
.task.closing .task-in::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(0,229,255,.0) 30%,rgba(0,229,255,.45) 50%,rgba(0,229,255,0) 70%,transparent 100%);
  background-size:250% 100%;animation:scan 460ms var(--ease) forwards;
}
.task.closing .task-in{border-color:var(--cyan);box-shadow:0 0 24px -6px var(--cyan)}
@keyframes scan{from{background-position:120% 0}to{background-position:-30% 0}}

.shipped{border-top:1px solid var(--line);padding-top:8px}
.shipped summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;gap:10px;padding:0 4px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.shipped summary::-webkit-details-marker{display:none}
.shipped summary svg{transition:transform var(--t-med) var(--ease)}
.shipped[open] summary svg{transform:rotate(90deg)}
.shipped summary .c{margin-left:auto;color:var(--cyan)}
.shipped .list{padding-top:4px}
.shipped .task-in{background:rgba(10,15,28,.5)}

.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:15px;border:1px dashed var(--line);border-radius:var(--r-sm)}
.empty strong{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}
.link{color:var(--cyan);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 4px}

/* ---------- goals ---------- */
.goal{display:flex;flex-direction:column;gap:12px;overflow:hidden}
.goal-foot .stepper{margin-left:auto;gap:8px}
.goal.main{border-color:rgba(0,229,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 0 30px -14px rgba(0,229,255,.6)}
.goal-top{display:flex;align-items:flex-start;gap:8px}
.goal-name{flex:1;min-width:0;text-align:left;font-size:17px;font-weight:600;line-height:1.3;padding:10px 0;overflow-wrap:anywhere}
.goal-val{font-family:var(--mono);font-size:24px;font-weight:700;white-space:nowrap;padding-top:6px}
.goal-val small{color:var(--muted);font-size:15px;font-weight:500}
.bar{height:8px;border-radius:99px;background:rgba(0,229,255,.08);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 12px rgba(0,229,255,.7);transform-origin:left;transition:transform 800ms var(--ease);width:100%}
.goal-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.goal-foot .meta{flex:1;min-width:120px}
.pill{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-soft)}
.pill.reached{border-color:var(--cyan);color:var(--on-cyan);background:var(--cyan)}
.addgoal{display:flex;flex-direction:column;gap:12px}
.btn{height:48px;border-radius:14px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--t-fast),box-shadow var(--t-fast)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--cyan);color:var(--on-cyan);box-shadow:0 0 20px -6px var(--cyan)}
.btn.ghost{border:1px solid var(--line-strong);color:var(--cyan);background:rgba(0,229,255,.05)}
.btn.danger{border:1px solid rgba(255,138,61,.5);color:var(--orange);background:transparent}
.btn.wide{width:100%}

/* burst */
.burst{position:relative}
.burst::after{
  content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(0,229,255,.55),rgba(139,92,246,.25) 45%,transparent 70%);
  animation:burst 900ms var(--ease) forwards;
}
@keyframes burst{0%{transform:scale(.2);opacity:1}100%{transform:scale(14);opacity:0}}

/* ---------- form fields / sheet ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input{height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:rgba(5,7,13,.6);font-size:16px;width:100%;min-width:0}
.field input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.inline{display:flex;gap:8px;align-items:center}
.inline input{flex:1}
.clear{height:48px;padding:0 12px;border-radius:12px;color:var(--muted);border:1px solid var(--line);font-size:14px;flex:none}

dialog.sheet{
  margin:auto auto 0;width:100%;max-width:640px;border:0;padding:0;background:transparent;color:var(--fg);
  max-height:92vh;
}
dialog.sheet::backdrop{background:rgba(2,4,9,.66);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-in{
  background:linear-gradient(to bottom,rgba(16,24,42,.97),rgba(8,12,22,.98));border:1px solid var(--line-strong);border-bottom:0;
  border-radius:22px 22px 0 0;padding:10px var(--gutter) calc(env(safe-area-inset-bottom,0px) + 18px);
  display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px -10px rgba(0,229,255,.25);
}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line-strong);margin:0 auto 4px}
.sheet h2{font-size:18px}
.sheet-actions{display:flex;gap:10px}
.sheet-actions .btn{flex:1}
dialog[open] .sheet-in{animation:up var(--t-med) var(--ease)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:0 var(--gutter) env(safe-area-inset-bottom,0px);
  background:linear-gradient(to top,rgba(5,7,13,.96),rgba(5,7,13,.82));
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);
}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tab-h)}
.tab{text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);font-size:12px;font-weight:500;letter-spacing:.04em;position:relative;transition:color var(--t-fast)}
.tab[aria-current="page"]{color:var(--cyan)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.tab[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(0,229,255,.6))}
.tab .badge{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--orange);color:#1a0b02;font-family:var(--mono);font-size:11px;font-weight:700;display:grid;place-items:center}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,12px);z-index:50;
  width:calc(100% - 32px);max-width:480px;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;min-height:52px;
  background:rgba(14,22,40,.96);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.7),0 0 20px -10px var(--cyan);
  opacity:0;pointer-events:none;transition:opacity var(--t-med),transform var(--t-med) var(--ease);font-size:15px;
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.warn{border-color:rgba(255,138,61,.6)}
.toast .msg{flex:1;min-width:0}
.toast button{height:40px;padding:0 14px;border-radius:10px;color:var(--cyan);font-weight:600;border:1px solid var(--line-strong)}
.toast button[hidden]{display:none}

@media (min-width:720px){
  main{padding-top:28px}
  h1{font-size:26px}
  .hero{flex-direction:row;justify-content:center;gap:36px;padding:28px}
  .hero-side{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
  .hero-name,.hero-meta{text-align:left}
  dialog.sheet{margin:auto}

}

    </button>
    <form class="panel addgoal" id="goalForm" autocomplete="off" hidden>

<dialog class="sheet" id="taskSheet" aria-labelledby="tsTitle">

    <datalist id="projList"></datalist>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="msg" id="toastMsg"></span><button type="button" id="toastAction" hidden>Fortryd</button></div>

<script>
(() => {
'use strict';
const KEY = 'missionControl.v1';
const FOCUS_MAX = 3;
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = k => Math.round((parseKey(k) - parseKey(todayKey())) / 864e5);
const weekStart = () => { const d = new Date(); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return keyOf(d); };
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const DAYS = ['søn','man','tir','ons','tor','fre','lør'];
function dueLabel(k) {
  const n = diffDays(k);
  if (n === 0) return 'i dag';
  if (n === 1) return 'i morgen';
  if (n === -1) return 'i går';
  if (n < 0) return `${-n} dage over`;
  const d = parseKey(k);
  if (n < 7) return `${DAYS[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()]}`;
  return `${d.getDate()}. ${MONTHS[d.getMonth()]}`;
}
const tMinus = k => { const n = diffDays(k); return n >= 0 ? `T−${n}d` : `T+${-n}d`; };

/* ---------- storage ---------- */
let storageOK = true;
function seed() {
  const t = todayKey(), now = Date.now();
  const mk = (text, project, extra = {}) => ({ id: uid(), text, project, due: null, focus: false, done: false, doneAt: null, createdAt: now, ...extra });
  return {
    v: 1,
    tasks: [
      mk('Agent skal svare: “Book tid til værkstedet på hjemmesiden”', 'bilhuset-lind', { focus: true, due: t }),
      mk('Tag telefonen ved intet svar i hverdagen', 'bilhuset-lind'),
      mk('Tool til tjek af biler på lager', 'bilhuset-lind'),
      mk('Håndtér fejlede opkald ordentligt', 'platform', { focus: true }),
      mk('Agent workspace', 'platform'),
      mk('SOP og knowledge base', 'platform'),
    ],
    goals: [{ id: uid(), name: '5 første kunder', current: 0, target: 5, due: null, main: true, createdAt: now }],
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.tasks) && Array.isArray(d.goals)) return d;
    }
  } catch (e) { storageOK = false; }
  return seed();
}
let state = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
  catch (e) {
    if (storageOK) toast('Kan ikke gemme på denne enhed. Ændringer forsvinder ved genindlæsning.', { warn: true });
    storageOK = false;
  }
}
function commit() { save(); render(); }

/* ---------- projects ---------- */
const projName = p => p ? p.split(/[-_]/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(' ') : 'Indbakke';
const projKey = s => s.trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '-');
const projects = () => [...new Set(state.tasks.map(t => t.project).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'da'));

/* ---------- input parsing ---------- */
function parseInput(raw) {
  let project = null, due = null;
  let s = ' ' + raw + ' ';
  s = s.replace(/(\s)#([\p{L}\p{N}_-]+)(?=\s)/gu, (m, sp, tag) => { if (!project) project = projKey(tag); return sp; });
  s = s.replace(/(\s)!(i-?dag|i-?morgen|(\d{1,2})[./](\d{1,2}))(?=\s)/giu, (m, sp, w, d, mo) => {
    const lw = w.toLowerCase().replace('-', '');
    if (lw === 'idag') due = todayKey();
    else if (lw === 'imorgen') due = addDays(todayKey(), 1);
    else {
      const now = new Date();
      let dt = new Date(now.getFullYear(), Number(mo) - 1, Number(d));
      if (dt.getMonth() !== Number(mo) - 1) return m;
      if (keyOf(dt) < todayKey()) dt = new Date(now.getFullYear() + 1, Number(mo) - 1, Number(d));
      due = keyOf(dt);
    }
    return sp;
  });
  return { text: s.replace(/\s+/g, ' ').trim(), project, due };
}

/* ---------- task actions ---------- */
const openFocus = () => state.tasks.filter(t => t.focus && !t.done);
function addTask(raw) {
  const p = parseInput(raw);
  if (!p.text) { toast('Skriv lidt tekst før du trykker enter.'); return false; }
  state.tasks.push({ id: uid(), text: p.text, project: p.project, due: p.due, focus: false, done: false, doneAt: null, createdAt: Date.now() });
  commit();
  return true;
}
const findTask = id => state.tasks.find(t => t.id === id);
function toggleFocus(id) {
  const t = findTask(id); if (!t) return;
  if (!t.focus && openFocus().length >= FOCUS_MAX) {
    toast('Dagens fokus er fuld (3/3). Fjern en stjerne først, så der er plads.');
    return;
  }
  t.focus = !t.focus;
  commit();
}
function completeTask(id, li) {
  const t = findTask(id); if (!t || li.classList.contains('closing')) return;
  if (t.done) { t.done = false; t.doneAt = null; commit(); return; }
  li.classList.add('closing');
  setTimeout(() => {
    t.done = true; t.doneAt = Date.now(); t.focus = false;
    commit();
    toast(`Shipped: ${t.text}`, { action: 'Fortryd', onAction: () => { t.done = false; t.doneAt = null; commit(); } });
  }, reduced.matches ? 0 : 440);
}
function deleteTask(id) {
  const i = state.tasks.findIndex(t => t.id === id); if (i < 0) return;
  const [t] = state.tasks.splice(i, 1);
  commit();
  toast('Opgave slettet.', { action: 'Fortryd', onAction: () => { state.tasks.splice(i, 0, t); commit(); } });
}

/* ---------- goal actions ---------- */
const mainGoal = () => state.goals.find(g => g.main);
let burstId = null;
function stepGoal(id, delta) {
  const g = state.goals.find(x => x.id === id); if (!g) return;
  const before = g.current;
  g.current = Math.max(0, g.current + delta);
  if (before < g.target && g.current >= g.target) { burstId = g.id; toast(`Mål nået: ${g.name}`); }
  commit();
  if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}
}
function setMain(id) {
  state.goals.forEach(g => { g.main = g.id === id; });
  commit();
}

/* ---------- icons ---------- */
const I = {
  check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
  star: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>',
  target: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>',
};

/* ---------- render: task row ---------- */
function taskRow(t, { showProject = false } = {}) {
  const meta = [];
  if (showProject && t.project) meta.push(`<span class="proj">#${esc(t.project)}</span>`);
  let over = false;
  if (t.due && !t.done) {
    const n = diffDays(t.due); over = n < 0;
    meta.push(`<span class="due ${over ? 'over' : n === 0 ? 'today' : ''}">${over ? 'Overskredet · ' : ''}${dueLabel(t.due)}</span>`);
  }
  if (t.done && t.doneAt) { const d = new Date(t.doneAt); meta.push(`<span>lukket ${d.getDate()}. ${MONTHS[d.getMonth()]}</span>`); }
  return `<li class="task${t.done ? ' done' : ''}${over ? ' overdue' : ''}" data-id="${t.id}">
    <div class="task-del" aria-hidden="true">Slet</div>
    <div class="task-in">
      <button class="check" type="button" data-act="done" aria-label="${t.done ? 'Genåbn' : 'Markér som færdig'}: ${esc(t.text)}"><span class="c">${I.check}</span></button>
      <div class="body" role="button" tabindex="0" data-act="edit" aria-label="Redigér: ${esc(t.text)}">
        <span class="txt">${esc(t.text)}</span>
        <span class="meta">${meta.join('')}</span>
      </div>
      ${t.done ? '' : `<button class="star" type="button" data-act="focus" aria-pressed="${t.focus}" aria-label="Dagens fokus">${I.star}</button>`}
    </div>
  </li>`;
}
function sortTasks(a, b) {
  if (a.focus !== b.focus) return a.focus ? -1 : 1;
  if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (!!a.due !== !!b.due) return a.due ? -1 : 1;
  return a.createdAt - b.createdAt;
}

/* ---------- render: ring ---------- */
function ring(g) {
  const pct = g.target > 0 ? Math.min(1, g.current / g.target) : 0;
  const ticks = [];
  if (g.target > 1 && g.target <= 24) {
    for (let i = 0; i < g.target; i++) {
      const a = (i / g.target) * Math.PI * 2 - Math.PI / 2;
      const r1 = 104, r2 = 110;
      ticks.push(`<line class="ring-tick" x1="${120 + Math.cos(a) * r1}" y1="${120 + Math.sin(a) * r1}" x2="${120 + Math.cos(a) * r2}" y2="${120 + Math.sin(a) * r2}"/>`);
    }
  }
  return `<div class="ring-wrap" id="mainRing">
    <svg viewBox="0 0 240 240" role="img" aria-label="${esc(g.name)}: ${g.current} af ${g.target}">
      ${ticks.join('')}
      <circle class="ring-track" cx="120" cy="120" r="92"/>
      <circle class="ring-bar" cx="120" cy="120" r="92" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - pct * 100}" transform="rotate(-90 120 120)" style="${pct === 0 ? 'opacity:0' : ''}"/>
    </svg>
    <div class="ring-center"><div class="ring-val">${g.current}<small>/${g.target}</small></div><div class="ring-pct">${Math.round(pct * 100)}%</div></div>
  </div>`;
}

/* ---------- render: screens ---------- */
let lastRingPct = null;
function renderKontrol() {
  const g = mainGoal();
  const hero = $('#heroPanel');
  if (g) {
    const pct = g.target > 0 ? Math.min(1, g.current / g.target) : 0;
    const meta = [`HOVEDMÅL`];
    if (g.due) meta.push(`${tMinus(g.due)} · ${dueLabel(g.due)}`);
    hero.innerHTML = `${ring(g)}
      <div class="hero-side">
        <div class="hero-meta">${meta.join(' · ')}</div>
        <div class="hero-name">${esc(g.name)}</div>
        <div class="stepper">
          <button class="step minus" type="button" data-goal="${g.id}" data-d="-1" aria-label="Træk én fra">${I.minus}</button>
          <button class="step" type="button" data-goal="${g.id}" data-d="1" aria-label="Læg én til">${I.plus}</button>
        </div>
      </div>`;
    // animate ring from previous value
    const bar = hero.querySelector('.ring-bar');
    if (lastRingPct !== null && lastRingPct !== pct && !reduced.matches) {
      bar.style.transition = 'none';
      bar.setAttribute('stroke-dashoffset', 100 - lastRingPct * 100);
      bar.style.opacity = 1;
      bar.getBoundingClientRect();
      bar.style.transition = '';
      bar.setAttribute('stroke-dashoffset', 100 - pct * 100);
      if (pct === 0) setTimeout(() => { bar.style.opacity = 0; }, 900);
    }
    lastRingPct = pct;
  } else {
    lastRingPct = null;
    hero.innerHTML = `<div class="empty" style="width:100%"><strong>Intet hovedmål valgt</strong>Vælg et mål som hovedmål, så lyser det op her.<br><a class="link" href="#maal">Gå til Mål</a></div>`;
  }

  const t0 = todayKey(), w0 = weekStart();
  const doneKeys = state.tasks.filter(t => t.done && t.doneAt).map(t => keyOf(new Date(t.doneAt)));
  const today = doneKeys.filter(k => k === t0).length;
  const week = doneKeys.filter(k => k >= w0).length;
  const over = state.tasks.filter(t => !t.done && t.due && diffDays(t.due) < 0).length;
  $('#stats').innerHTML = `
    <div class="stat"><div class="n">${today}</div><div class="l">Lukket i dag</div></div>
    <div class="stat"><div class="n">${week}</div><div class="l">Denne uge</div></div>
    <div class="stat${over ? ' warn' : ''}"><div class="n">${over}</div><div class="l">Overskredet</div></div>`;

  const f = openFocus().sort(sortTasks);
  $('#focusCount').textContent = `${f.length}/${FOCUS_MAX}`;
  $('#focusList').innerHTML = f.length ? f.map(t => taskRow(t, { showProject: true })).join('')
    : `<li class="empty"><strong>Ingen fokus endnu</strong>Tryk på stjernen ud for op til tre opgaver under <a class="link" href="#opgaver">Opgaver</a>.</li>`;
}

function renderOpgaver() {
  const open = state.tasks.filter(t => !t.done);
  const done = state.tasks.filter(t => t.done).sort((a, b) => b.doneAt - a.doneAt);
  $('#openCount').textContent = `${open.length} åbne`;
  const groups = new Map();
  open.forEach(t => { const k = t.project || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
  const keys = [...groups.keys()].sort((a, b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b, 'da'));
  $('#groups').innerHTML = keys.length ? keys.map(k => {
    const list = groups.get(k).sort(sortTasks);
    return `<section class="group" aria-label="${esc(projName(k))}">
      <div class="group-head${k ? '' : ' inbox'}"><span>${esc(projName(k))}</span><span class="c mono">${list.length}</span></div>
      <ul class="list">${list.map(t => taskRow(t)).join('')}</ul>
    </section>`;
  }).join('') : `<div class="empty"><strong>Alt er lukket</strong>Skriv næste opgave i feltet ovenfor og tryk enter.</div>`;

  $('#shippedCount').textContent = done.length;
  $('#shippedList').innerHTML = done.length ? done.map(t => taskRow(t, { showProject: true })).join('')
    : `<li class="empty">Intet shipped endnu. Tryk på cirklen ud for en opgave når den er klaret.</li>`;

  const ps = projects();
  $('#projChips').innerHTML = ps.map(p => `<button class="chip" type="button" data-tag="${esc(p)}">#${esc(p)}</button>`).join('');
  $('#projChips').hidden = !ps.length;
  $('#projList').innerHTML = ps.map(p => `<option value="${esc(p)}">`).join('');
}

function renderMaal() {
  const gs = state.goals;
  $('#goalCount').textContent = gs.length ? `${gs.filter(g => g.current >= g.target).length}/${gs.length} nået` : '';
  $('#goalList').innerHTML = gs.length ? gs.map(g => {
    const pct = g.target > 0 ? Math.min(1, g.current / g.target) : 0;
    const reached = g.current >= g.target;
    const over = g.due && !reached && diffDays(g.due) < 0;
    const meta = [];
    if (g.due) meta.push(`<span class="due ${over ? 'over' : ''}">${tMinus(g.due)} · ${dueLabel(g.due)}</span>`);
    meta.push(`<span>${Math.round(pct * 100)}%</span>`);
    return `<article class="panel goal${g.main ? ' main' : ''}" data-goal-id="${g.id}">
      <div class="goal-top">
        <button class="goal-name" type="button" data-edit-goal="${g.id}" aria-label="Redigér mål: ${esc(g.name)}">${esc(g.name)}</button>
        <div class="goal-val mono">${g.current}<small>/${g.target}</small></div>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${g.target}" aria-valuenow="${g.current}" aria-label="${esc(g.name)}"><i style="transform:scaleX(${pct})" data-pct="${pct}"></i></div>
      <div class="goal-foot">
        <span class="meta">${meta.join('')}</span>
        ${reached ? `<span class="pill reached">Nået</span>` : ''}
        <button class="pill" type="button" data-main="${g.id}" aria-pressed="${!!g.main}">${I.target}${g.main ? 'Hovedmål' : 'Gør til hovedmål'}</button>
        <div class="stepper"><button class="step sm minus" type="button" data-goal="${g.id}" data-d="-1" aria-label="Træk én fra ${esc(g.name)}">${I.minus}</button>
        <button class="step sm" type="button" data-goal="${g.id}" data-d="1" aria-label="Læg én til ${esc(g.name)}">${I.plus}</button></div>
      </div>
    </article>`;
  }).join('') : `<div class="empty"><strong>Ingen mål endnu</strong>Tilføj et mål med en målværdi, fx 5 første kunder.</div>`;
}

const prevBars = new Map();
function render() {
  renderKontrol(); renderOpgaver();
  // keep goal bars animating from their previous width
  document.querySelectorAll('#goalList .bar i').forEach(i => prevBars.set(i.closest('[data-goal-id]').dataset.goalId, i.dataset.pct));
  renderMaal();
  if (!reduced.matches) document.querySelectorAll('#goalList .bar i').forEach(i => {
    const id = i.closest('[data-goal-id]').dataset.goalId, p = prevBars.get(id);
    if (p != null && p !== i.dataset.pct) { i.style.transition = 'none'; i.style.transform = `scaleX(${p})`; i.getBoundingClientRect(); i.style.transition = ''; i.style.transform = `scaleX(${i.dataset.pct})`; }
  });
  const over = state.tasks.filter(t => !t.done && t.due && diffDays(t.due) < 0).length;
  const b = $('#overBadge'); b.hidden = !over; b.textContent = over;
  b.setAttribute('aria-label', `${over} overskredne`);
  const d = new Date();
  $('#stamp').textContent = `${DAYS[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth() + 1)} · U${isoWeek(d)}`;
  if (burstId) {
    const id = burstId; burstId = null;
    const targets = [document.querySelector(`[data-goal-id="${id}"]`)];
    if (mainGoal() && mainGoal().id === id) targets.push($('#heroPanel'));
    targets.filter(Boolean).forEach(el => { el.classList.remove('burst'); el.getBoundingClientRect(); el.classList.add('burst'); setTimeout(() => el.classList.remove('burst'), 1000); });
  }
}
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}

/* ---------- toast ---------- */
let toastTimer, toastCb;
function toast(msg, { action, onAction, warn } = {}) {
  const el = $('#toast'), btn = $('#toastAction');
  $('#toastMsg').textContent = msg;
  el.classList.toggle('warn', !!warn);
  btn.hidden = !action; btn.textContent = action || '';
  toastCb = onAction || null;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action ? 5000 : 2800);
}
$('#toastAction').addEventListener('click', () => { const cb = toastCb; toastCb = null; $('#toast').classList.remove('show'); if (cb) cb(); });

/* ---------- routing ---------- */
const TABS = ['kontrol', 'opgaver', 'maal'];
function route() {
  const h = location.hash.replace('#', '');
  const cur = TABS.includes(h) ? h : 'kontrol';
  TABS.forEach(t => { $('#screen-' + t).hidden = t !== cur; });
  document.querySelectorAll('.tab').forEach(a => { if (a.dataset.tab === cur) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);

/* ---------- capture forms ---------- */
function bindCapture(formSel, inputSel, from) {
  $(formSel).addEventListener('submit', e => {
    e.preventDefault();
    const inp = $(inputSel);
    if (addTask(inp.value)) {
      inp.value = '';
      if (from === 'kontrol') toast('Tilføjet til Opgaver.');
    }
    inp.focus();
  });
}
bindCapture('#quickForm', '#quickInput', 'kontrol');
bindCapture('#taskForm', '#taskInput', 'opgaver');
$('#projChips').addEventListener('click', e => {
  const c = e.target.closest('[data-tag]'); if (!c) return;
  const inp = $('#taskInput');
  const tag = '#' + c.dataset.tag;
  const cleaned = inp.value.replace(/(^|\s)#[\p{L}\p{N}_-]+/gu, '').trim();
  inp.value = (cleaned ? cleaned + ' ' : '') + tag + ' ';
  inp.focus();
  inp.setSelectionRange(0, 0);
});

/* ---------- task list interactions (tap, long-press, swipe) ---------- */
let suppressClick = false;
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    const li = actEl.closest('.task'); const id = li.dataset.id;
    const act = actEl.dataset.act;
    if (act === 'done') completeTask(id, li);
    else if (act === 'focus') toggleFocus(id);
    else if (act === 'edit') openTaskSheet(id);
    return;
  }
  const step = e.target.closest('[data-goal][data-d]');
  if (step) { stepGoal(step.dataset.goal, Number(step.dataset.d)); return; }
  const m = e.target.closest('[data-main]');
  if (m) { setMain(m.dataset.main); toast('Hovedmål vises nu på Kontrol.'); return; }
  const eg = e.target.closest('[data-edit-goal]');
  if (eg) openGoalSheet(eg.dataset.editGoal);
}, true);
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.body[data-act="edit"]')) { e.preventDefault(); openTaskSheet(e.target.closest('.task').dataset.id); }
});

let g = null; // gesture
document.addEventListener('pointerdown', e => {
  const li = e.target.closest('.task'); if (!li || e.button > 0) return;
  if (e.target.closest('.check,.star')) return;
  g = { li, id: li.dataset.id, x: e.clientX, y: e.clientY, dx: 0, mode: null, pid: e.pointerId };
  li.classList.add('pressing');
  g.timer = setTimeout(() => {
    if (!g || g.mode) return;
    g.mode = 'long'; li.classList.remove('pressing');
    suppressClick = true;
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (err) {}
    openTaskSheet(g.id);
  }, 480);
});
document.addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.pid) return;
  const dx = e.clientX - g.x, dy = e.clientY - g.y;
  if (!g.mode) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) { g.mode = 'swipe'; g.li.classList.add('dragging'); clearTimeout(g.timer); g.li.classList.remove('pressing'); }
    else if (Math.abs(dy) > 10) { cancelGesture(); return; }
  }
  if (g && g.mode === 'swipe') {
    g.dx = Math.min(0, dx);
    g.li.querySelector('.task-in').style.transform = `translateX(${g.dx}px)`;
  }
});
function endGesture() {
  if (!g) return;
  clearTimeout(g.timer);
  const { li, mode, dx, id } = g;
  li.classList.remove('pressing', 'dragging');
  const inner = li.querySelector('.task-in');
  if (mode === 'swipe') {
    suppressClick = true; setTimeout(() => { suppressClick = false; }, 50);
    if (dx < -Math.min(120, li.offsetWidth * 0.35)) {
      li.classList.add('swiped'); inner.style.transform = 'translateX(-110%)';
      setTimeout(() => deleteTask(id), reduced.matches ? 0 : 180);
    } else inner.style.transform = '';
  }
  g = null;
}
function cancelGesture() { if (!g) return; clearTimeout(g.timer); g.li.classList.remove('pressing', 'dragging'); g.li.querySelector('.task-in').style.transform = ''; g = null; }
document.addEventListener('pointerup', endGesture);
document.addEventListener('pointercancel', cancelGesture);
document.addEventListener('contextmenu', e => { if (e.target.closest('.task')) e.preventDefault(); });

/* ---------- task sheet ---------- */
let editingTask = null;
const taskSheet = $('#taskSheet');
function openSheet(d) { try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } }
function openTaskSheet(id) {
  const t = findTask(id); if (!t) return;
  editingTask = id;
  $('#tText').value = t.text;
  $('#tProj').value = t.project || '';
  $('#tDue').value = t.due || '';
  $('#tReopen').hidden = !t.done;
  openSheet(taskSheet);
}
$('#tDueClear').addEventListener('click', () => { $('#tDue').value = ''; });
$('#taskEdit').addEventListener('submit', e => {
  e.preventDefault();
  const t = findTask(editingTask); if (!t) return taskSheet.close();
  const text = $('#tText').value.trim();
  if (!text) { $('#tText').focus(); return; }
  t.text = text;
  t.project = $('#tProj').value.trim() ? projKey($('#tProj').value) : null;
  t.due = $('#tDue').value || null;
  taskSheet.close(); commit();
});
$('#tDelete').addEventListener('click', () => { taskSheet.close(); deleteTask(editingTask); });
$('#tReopen').addEventListener('click', () => { const t = findTask(editingTask); if (t) { t.done = false; t.doneAt = null; } taskSheet.close(); commit(); });

/* ---------- goal sheet + form ---------- */
let editingGoal = null;
const goalSheet = $('#goalSheet');
function openGoalSheet(id) {
  const gl = state.goals.find(x => x.id === id); if (!gl) return;
  editingGoal = id;
  $('#eName').value = gl.name; $('#eCur').value = gl.current; $('#eTarget').value = gl.target; $('#eDue').value = gl.due || '';
  openSheet(goalSheet);
}
$('#eDueClear').addEventListener('click', () => { $('#eDue').value = ''; });
$('#goalEdit').addEventListener('submit', e => {
  e.preventDefault();
  const gl = state.goals.find(x => x.id === editingGoal); if (!gl) return goalSheet.close();
  const name = $('#eName').value.trim(); if (!name) { $('#eName').focus(); return; }
  const before = gl.current;
  gl.name = name;
  gl.target = Math.max(1, parseInt($('#eTarget').value, 10) || gl.target);
  gl.current = Math.max(0, parseInt($('#eCur').value, 10) || 0);
  gl.due = $('#eDue').value || null;
  if (before < gl.target && gl.current >= gl.target) burstId = gl.id;
  goalSheet.close(); commit();
});
$('#gDelete').addEventListener('click', () => {
  const i = state.goals.findIndex(x => x.id === editingGoal); if (i < 0) return;
  const [gl] = state.goals.splice(i, 1);
  goalSheet.close(); commit();
  toast('Mål slettet.', { action: 'Fortryd', onAction: () => { state.goals.splice(i, 0, gl); commit(); } });
});
[taskSheet, goalSheet].forEach(d => d.addEventListener('click', e => { if (e.target === d) d.close(); }));

const goalForm = $('#goalForm'), newGoalBtn = $('#newGoalBtn');
function toggleGoalForm(open) {
  goalForm.hidden = !open; newGoalBtn.hidden = open; newGoalBtn.setAttribute('aria-expanded', open);
  if (open) $('#gName').focus();
}
newGoalBtn.addEventListener('click', () => toggleGoalForm(true));
$('#cancelGoal').addEventListener('click', () => toggleGoalForm(false));
goalForm.addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#gName').value.trim(); if (!name) return;
  state.goals.push({ id: uid(), name, current: 0, target: Math.max(1, parseInt($('#gTarget').value, 10) || 1), due: $('#gDue').value || null, main: !mainGoal(), createdAt: Date.now() });
  goalForm.reset(); $('#gTarget').value = 10; toggleGoalForm(false); commit();
  toast(`Mål tilføjet: ${name}`);
});

/* ---------- home-screen icon (generated PNG) ---------- */
try {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d');
  x.fillStyle = '#05070D'; x.fillRect(0, 0, 180, 180);
  x.strokeStyle = 'rgba(0,229,255,.12)'; x.lineWidth = 1;
  for (let i = 0; i <= 180; i += 18) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 180); x.moveTo(0, i); x.lineTo(180, i); x.stroke(); }
  x.lineCap = 'round'; x.lineWidth = 14;
  x.strokeStyle = 'rgba(0,229,255,.15)'; x.beginPath(); x.arc(90, 90, 54, 0, Math.PI * 2); x.stroke();
  x.shadowColor = '#00E5FF'; x.shadowBlur = 18;
  const gr = x.createLinearGradient(30, 30, 150, 150); gr.addColorStop(0, '#8B5CF6'); gr.addColorStop(1, '#00E5FF');
  x.strokeStyle = gr; x.beginPath(); x.arc(90, 90, 54, -Math.PI / 2, Math.PI * 0.9); x.stroke();
  x.fillStyle = '#00E5FF'; x.beginPath(); x.arc(90, 90, 10, 0, Math.PI * 2); x.fill();
  const png = c.toDataURL('image/png');
  $('#touchIcon').href = png;
  const manifest = { name: 'Mission Control', short_name: 'Mission', display: 'standalone', background_color: '#05070D', theme_color: '#05070D', start_url: location.href.split('#')[0], icons: [{ src: png, sizes: '180x180', type: 'image/png' }] };
  const l = document.createElement('link'); l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  document.head.appendChild(l);
} catch (e) {}

/* ---------- boot ---------- */
render(); route(); save();
// refresh date-dependent labels when the app comes back after midnight
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
})();
</script>
</body>
