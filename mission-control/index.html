<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission Control</title>
<meta name="description" content="Opgaver og mål for AI-receptionisten. Hurtig som en note.">
<meta name="theme-color" content="#05070D">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column console. Sticky header, content panels with hairline rows, a floating capture dock + pill tab bar at the thumb. Single dark look by design. */
:root{
  --bg:#05070D;
  --panel:rgba(14,21,38,.58);
  --panel-solid:#0C1324;
  --hair:rgba(140,170,220,.09);
  --line:rgba(0,229,255,.14);
  --line-strong:rgba(0,229,255,.36);
  --grid:rgba(0,229,255,.04);
  --fg:#E8F1FF;
  --muted:#8C9BB5;
  --dim:#5A6884;
  --cyan:#00E5FF;
  --cyan-soft:rgba(0,229,255,.12);
  --violet:#8B5CF6;
  --violet-fg:#B9A2FF;
  --violet-soft:rgba(139,92,246,.16);
  --orange:#FF8A3D;
  --on-cyan:#021016;
  --font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:18px;
  --r-sm:12px;
  --gutter:16px;
  --tab-h:64px;
  --stack-h:150px;
  --kb:0px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --t-fast:140ms;
  --t-med:240ms;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%;background:var(--bg);overflow-x:clip}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:clip;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(110% 55% at 50% -12%,rgba(0,229,255,.09),transparent 60%),
    radial-gradient(70% 45% at 100% 100%,rgba(139,92,246,.07),transparent 60%),
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,
    var(--bg);
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 10px) var(--gutter) 10px;
  background:linear-gradient(to bottom,rgba(5,7,13,.94),rgba(5,7,13,.70));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--hair);
}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;font-weight:700}
.live{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);position:relative;flex:none}
.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--cyan);animation:ping 2.4s var(--ease) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(2.8);opacity:0}}
.stamp{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

/* ---------- layout ---------- */
main{max-width:640px;margin:0 auto;padding:16px var(--gutter) calc(var(--stack-h) + 24px)}
.screen{display:flex;flex-direction:column;gap:14px}
.screen.enter{animation:enter var(--t-med) var(--ease)}
@keyframes enter{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel{
  background:var(--panel);border:1px solid var(--hair);border-radius:var(--r);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
  position:relative;
}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.panel-head .c{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
.panel-head .c.hot{color:var(--cyan)}
.dot{width:6px;height:6px;border-radius:2px;background:var(--violet);box-shadow:0 0 8px var(--violet);flex:none}
.dot.inbox{background:var(--dim);box-shadow:none}
h1,h2{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:24px;letter-spacing:-.015em}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:2px 2px 0}
.title-row .count{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* ---------- hero (compact) ---------- */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:18px;padding:16px;overflow:hidden;border-color:var(--line)}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;overflow:visible}
.seg{fill:none;stroke-width:9;stroke-linecap:round}
.seg.off{stroke:rgba(0,229,255,.10)}
.seg.on{stroke:url(#ringGrad);filter:drop-shadow(0 0 4px rgba(0,229,255,.8)) drop-shadow(0 0 12px rgba(0,229,255,.3))}
.seg.pop{animation:segpop 700ms var(--spring)}
@keyframes segpop{0%{stroke-width:2;opacity:.2}60%{stroke-width:13;opacity:1}100%{stroke-width:9}}
.ring-bar{fill:none;stroke:url(#ringGrad);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(0,229,255,.75))}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-val{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.04em;display:flex;align-items:flex-end}
.ring-val small{font-size:16px;color:var(--muted);font-weight:500;letter-spacing:0;padding-bottom:2px}
.odo{display:inline-block;overflow:hidden;line-height:1.05;text-shadow:0 0 16px rgba(0,229,255,.55)}
.odo span{display:block}
.odo.up span{animation:odoUp 420ms var(--spring)}
.odo.down span{animation:odoDown 420ms var(--spring)}
@keyframes odoUp{from{transform:translateY(90%);opacity:0}to{transform:none;opacity:1}}
@keyframes odoDown{from{transform:translateY(-90%);opacity:0}to{transform:none;opacity:1}}
.ring-pct{font-family:var(--mono);font-size:10px;color:var(--cyan);letter-spacing:.16em;margin-top:6px}
.hero-side{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hero-name{font-size:19px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.tminus{font-family:var(--mono);font-size:12px;color:var(--cyan)}
.tminus.over{color:var(--orange)}
.stepper{display:flex;gap:8px;margin-top:6px}
.step{
  width:52px;height:44px;border-radius:13px;display:grid;place-items:center;border:1px solid var(--line-strong);
  background:rgba(0,229,255,.06);color:var(--cyan);transition:transform var(--t-fast) var(--spring),background var(--t-fast),box-shadow var(--t-fast);
}
.step:active{transform:scale(.92);background:var(--cyan-soft);box-shadow:0 0 18px -4px var(--cyan)}
.step.minus{color:var(--muted);border-color:var(--hair);background:rgba(255,255,255,.02)}
.step.sm{width:44px;height:44px;border-radius:12px}

/* ---------- stats strip ---------- */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.strip > div{padding:12px 14px;min-width:0}
.strip > div + div{border-left:1px solid var(--hair)}
.strip .n{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.strip .l{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .warn .n{color:var(--orange);text-shadow:0 0 12px rgba(255,138,61,.5)}

/* ---------- task rows ---------- */
.list{list-style:none;margin:0;padding:0 0 4px}
.task{position:relative;touch-action:pan-y}
.task + .task::before{content:"";position:absolute;top:0;left:56px;right:16px;height:1px;background:var(--hair)}
.swipe-bg{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;padding:0 22px;opacity:0;transition:opacity var(--t-fast);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;gap:8px;border-radius:var(--r-sm)}
.task[data-dir="right"] .swipe-bg{background:linear-gradient(90deg,rgba(0,229,255,.22),transparent 80%);color:var(--cyan);justify-content:flex-start}
.task[data-dir="left"] .swipe-bg{background:linear-gradient(270deg,rgba(255,138,61,.24),transparent 80%);color:var(--orange);justify-content:flex-end}
.task.dragging .swipe-bg,.task.swiped .swipe-bg{opacity:1}
.task.armed .swipe-bg svg{animation:arm 260ms var(--spring)}
@keyframes arm{50%{transform:scale(1.35)}}
.task-in{
  position:relative;display:flex;align-items:center;gap:2px;min-height:56px;padding:4px 6px;
  transition:transform var(--t-med) var(--ease),background var(--t-fast);
  -webkit-user-select:none;user-select:none;
}
.task.dragging .task-in{transition:none;background:var(--panel-solid);border-radius:var(--r-sm)}
.task.pressing .task-in{background:rgba(255,255,255,.03)}
.task.overdue .task-in::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--orange);box-shadow:0 0 10px var(--orange)}
.check,.star{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px}
.check .c{
  width:22px;height:22px;border-radius:50%;border:1.75px solid rgba(0,229,255,.45);display:grid;place-items:center;
  transition:background var(--t-med) var(--spring),border-color var(--t-fast),transform var(--t-med) var(--spring),box-shadow var(--t-med);
}
.check .c path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset 260ms var(--ease) 90ms}
.check:active .c{transform:scale(.86)}
.task.closing .check .c{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 14px var(--cyan);transform:scale(1.08)}
.task.done .check .c{background:rgba(0,229,255,.55);border-color:transparent}
.task.done .check .c path,.task.closing .check .c path{stroke-dashoffset:0}
.body{flex:1;min-width:0;padding:8px 6px;display:flex;flex-direction:column;gap:2px;cursor:text}
.txt{
  font-size:16px;line-height:1.35;overflow-wrap:anywhere;
  background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0% 1.5px;transition:background-size 320ms var(--ease),color 320ms;
}
.task.closing .txt{background-size:100% 1.5px;color:var(--muted)}
.task.done .txt{background-size:100% 1.5px;color:var(--muted);background-image:linear-gradient(var(--dim),var(--dim))}
.meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.meta:empty{display:none}
.meta .proj{color:var(--violet-fg)}
.meta .over{color:var(--orange)}
.meta .today{color:var(--cyan)}
.star{color:var(--dim);transition:color var(--t-fast),transform var(--t-fast) var(--spring)}
.star:active{transform:scale(.8)}
.star[aria-pressed="true"]{color:var(--cyan);filter:drop-shadow(0 0 6px rgba(0,229,255,.7))}
.star[aria-pressed="true"] path{fill:currentColor}
.task.closing .task-in::after{
  content:"";position:absolute;inset:0;border-radius:var(--r-sm);pointer-events:none;
  background:linear-gradient(90deg,transparent 0%,rgba(0,229,255,0) 35%,rgba(0,229,255,.32) 50%,rgba(0,229,255,0) 65%,transparent 100%);
  background-size:250% 100%;animation:scan 480ms var(--ease) forwards;
}
@keyframes scan{from{background-position:120% 0}to{background-position:-30% 0}}
.task.collapsing{overflow:hidden;opacity:0;transition:height 220ms var(--ease),opacity 160ms}
.task.fresh{animation:tokIn 340ms var(--spring)}

/* inline editor */
.task.editing{background:rgba(0,229,255,.035);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-sm)}
.task.editing::before,.task.editing + .task::before{display:none}
.ed-text{
  flex:1;min-width:0;resize:none;border:0;background:transparent;padding:10px 6px;font-size:16px;line-height:1.35;
  outline:none;overflow:hidden;caret-color:var(--cyan);-webkit-user-select:text;user-select:text;
}
.editor{position:relative;display:flex;flex-direction:column;gap:10px;padding:0 12px 12px 56px}
.ed-row{display:flex;flex-direction:column;gap:6px}
.ed-label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  position:relative;flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);background:rgba(255,255,255,.03);
  font-family:var(--mono);font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  transition:border-color var(--t-fast),color var(--t-fast),background var(--t-fast),transform var(--t-fast) var(--spring);
}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-soft)}
.chip.proj[aria-pressed="true"]{border-color:var(--violet);color:var(--violet-fg);background:var(--violet-soft)}
.chip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ed-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:2px}
.btn{height:44px;border-radius:13px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform var(--t-fast) var(--spring),box-shadow var(--t-fast)}
.btn:active{transform:scale(.96)}
.btn.sm{height:40px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--cyan);color:var(--on-cyan);box-shadow:0 0 20px -6px var(--cyan)}
.btn.ghost{border:1px solid var(--line-strong);color:var(--cyan);background:rgba(0,229,255,.05)}
.btn.danger{border:1px solid rgba(255,138,61,.45);color:var(--orange)}
.btn.wide{width:100%}

/* shipped */
.shipped summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.shipped summary::-webkit-details-marker{display:none}
.shipped summary svg{transition:transform var(--t-med) var(--ease)}
.shipped[open] summary svg{transform:rotate(90deg)}
.shipped summary .c{margin-left:auto;color:var(--cyan);display:inline-block;font-family:var(--mono)}
.bump{animation:bump 520ms var(--spring)}
@keyframes bump{40%{transform:scale(1.6);text-shadow:0 0 12px var(--cyan)}}

.empty{padding:18px 16px 20px;color:var(--muted);font-size:15px;line-height:1.5}
.empty strong{display:block;color:var(--fg);font-weight:600;margin-bottom:2px}
.link{color:var(--cyan);text-decoration:underline;text-underline-offset:3px}

/* ---------- goals ---------- */
.goal{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.goal + .goal{border-top:1px solid var(--hair)}
.goal:first-child{border-radius:var(--r) var(--r) 0 0}
.goal:last-child{border-radius:0 0 var(--r) var(--r)}
.goal:only-child{border-radius:var(--r)}
.goal-top{display:flex;align-items:center;gap:10px}
.goal-name{flex:1;min-width:0;text-align:left;font-size:17px;font-weight:600;line-height:1.3;padding:6px 0;overflow-wrap:anywhere}
.goal-val{font-family:var(--mono);font-size:22px;font-weight:700;white-space:nowrap;display:flex;align-items:flex-end}
.goal-val small{color:var(--muted);font-size:14px;font-weight:500;padding-bottom:2px}
.segs{display:flex;gap:4px;height:8px}
.segs i{flex:1;border-radius:3px;background:rgba(0,229,255,.09);transition:background var(--t-med),box-shadow var(--t-med)}
.segs i.on{background-image:linear-gradient(90deg,var(--violet),var(--cyan));background-size:var(--n,100%) 100%;box-shadow:0 0 10px rgba(0,229,255,.55)}
.segs i.pop{animation:barpop 600ms var(--spring)}
@keyframes barpop{0%{transform:scaleY(.3);opacity:.3}60%{transform:scaleY(1.7)}100%{transform:none}}
.bar{height:8px;border-radius:99px;background:rgba(0,229,255,.08);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--cyan));box-shadow:0 0 12px rgba(0,229,255,.7);transform-origin:left;transition:transform 800ms var(--ease)}
.goal-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.goal-foot .info{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);flex:1;min-width:90px}
.goal-foot .stepper{margin:0}
.pill{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{border-color:var(--line-strong);color:var(--cyan);background:var(--cyan-soft)}
.pill.reached{border-color:var(--cyan);color:var(--on-cyan);background:var(--cyan);font-weight:700}
.goal.main::after{content:"";position:absolute;left:0;top:16px;bottom:16px;width:2px;border-radius:2px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}

/* burst */
.burst::before{
  content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(0,229,255,.5),rgba(139,92,246,.22) 45%,transparent 70%);
  animation:burst 950ms var(--ease) forwards;
}
@keyframes burst{0%{transform:scale(.2);opacity:1}100%{transform:scale(16);opacity:0}}

/* ---------- capture dock ---------- */
.dock{
  position:fixed;left:0;right:0;z-index:25;pointer-events:none;
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
  padding:18px var(--gutter) 10px;
  background:linear-gradient(to bottom,rgba(5,7,13,0),rgba(5,7,13,.9) 45%);
  transform:translateY(calc(var(--kb) * -1));
}
.dock-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock-in > *{pointer-events:auto}
.tokens{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tokens::-webkit-scrollbar{display:none}
.tokens .chip{background:rgba(12,19,36,.94)}
.tok{height:30px;padding:0 10px;border-radius:999px;font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center;gap:6px;flex:none;animation:tokIn 220ms var(--spring);background:rgba(12,19,36,.94)}
.tok.p{color:var(--violet-fg);border:1px solid rgba(139,92,246,.55)}
.tok.d{color:var(--cyan);border:1px solid var(--line-strong)}
.tok.new{color:var(--muted);border:1px dashed var(--dim)}
@keyframes tokIn{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.capture{position:relative}
.capture input{
  width:100%;height:52px;padding:0 54px 0 42px;border-radius:16px;
  background:rgba(14,22,40,.94);border:1px solid var(--line-strong);font-size:16px;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 10px 30px -12px rgba(0,0,0,.8),0 0 22px -12px rgba(0,229,255,.6);
  transition:box-shadow var(--t-med) var(--ease),border-color var(--t-med);
}
.capture input::placeholder{color:var(--dim)}
.capture input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft),0 0 28px -6px rgba(0,229,255,.5)}
.capture .prompt{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-family:var(--mono);color:var(--cyan);font-size:17px;font-weight:700;pointer-events:none;text-shadow:0 0 8px rgba(0,229,255,.7);z-index:2}
.capture .go{position:absolute;right:5px;top:5px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--cyan);color:var(--on-cyan);transition:transform var(--t-fast) var(--spring),opacity var(--t-fast)}
.capture .go:active{transform:scale(.9)}
.capture input:placeholder-shown + .go{opacity:.3}
body.typing .dock{bottom:0;padding-bottom:10px}
body.typing .tabbar{transform:translateY(110%)}
body.no-dock .dock{display:none}

/* ---------- tab bar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:0 var(--gutter) env(safe-area-inset-bottom,0px);
  background:rgba(5,7,13,.95);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--hair);
  transition:transform var(--t-med) var(--ease);
}
.tabbar-in{max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tab-h);position:relative}
.tab-ind{position:absolute;top:10px;bottom:10px;left:0;width:calc(100% / 3);transition:transform 380ms var(--spring);pointer-events:none}
.tab-ind::before{content:"";position:absolute;inset:0 6px;border-radius:14px;background:var(--cyan-soft);border:1px solid var(--line-strong);box-shadow:0 0 18px -6px var(--cyan)}
.tab{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--dim);font-size:14px;font-weight:600;text-decoration:none;transition:color var(--t-fast)}
.tab svg{transition:transform var(--t-fast) var(--spring)}
.tab .lbl{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width 320ms var(--ease),opacity 200ms}
.tab[aria-current="page"]{color:var(--cyan)}
.tab[aria-current="page"] .lbl{max-width:90px;opacity:1}
.tab[aria-current="page"] svg{filter:drop-shadow(0 0 6px rgba(0,229,255,.6))}
.tab:active svg{transform:scale(.88)}
.badge{position:absolute;top:10px;left:calc(50% + 4px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--orange);color:#1a0b02;font-family:var(--mono);font-size:10px;font-weight:700;display:grid;place-items:center}
.tab[aria-current="page"] .badge{left:auto;right:12px}

/* ---------- sheet ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field input{height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--hair);background:rgba(5,7,13,.6);font-size:16px;width:100%;min-width:0}
.field input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
dialog.sheet{margin:auto auto 0;width:100%;max-width:640px;border:0;padding:0;background:transparent;color:var(--fg);max-height:92vh}
dialog.sheet::backdrop{background:rgba(2,4,9,.66);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet-in{
  background:linear-gradient(to bottom,#101931,#080C17);border:1px solid var(--line-strong);border-bottom:0;
  border-radius:22px 22px 0 0;padding:10px var(--gutter) calc(env(safe-area-inset-bottom,0px) + 18px);
  display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px -10px rgba(0,229,255,.25);
}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line-strong);margin:0 auto 4px}
.sheet h2{font-size:18px}
.sheet-actions{display:flex;gap:10px}
.sheet-actions .btn{flex:1}
dialog[open] .sheet-in{animation:up 300ms var(--spring)}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(var(--stack-h) + 10px);transform:translate(-50%,10px) scale(.97);z-index:50;
  width:calc(100% - 32px);max-width:480px;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;min-height:50px;
  background:rgba(16,25,46,.97);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 12px 30px -8px rgba(0,0,0,.8),0 0 20px -10px var(--cyan);
  opacity:0;pointer-events:none;transition:opacity var(--t-med),transform var(--t-med) var(--spring);font-size:15px;
}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.warn{border-color:rgba(255,138,61,.6)}
.toast .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{height:38px;padding:0 14px;border-radius:10px;color:var(--cyan);font-weight:600;border:1px solid var(--line-strong);flex:none}

@media (min-width:720px){
  main{padding-top:28px}
  h1{font-size:28px}
  .ring{width:156px;height:156px}
  .ring-val{font-size:40px}
  dialog.sheet{margin:auto}
  .sheet-in{border-radius:22px;border-bottom:1px solid var(--line-strong);padding-bottom:22px}
}
@media (max-width:350px){ .ring{width:112px;height:112px} .ring-val{font-size:28px} .hero{gap:12px} }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;transition-delay:0ms!important}
  .live::after,.burst::before{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ringGrad" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="110" y2="110">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#00E5FF"/><stop offset="1" stop-color="#8AF5FF"/>
    </linearGradient>
  </defs>
</svg>

<header class="top">

    <div class="stamp" id="stamp"></div>

<main>
  <!-- KONTROL -->

      <ul class="list" id="focusList"></ul>

  <!-- OPGAVER -->
  <section class="screen" id="screen-opgaver" aria-labelledby="h-opgaver" hidden>

    <details class="panel shipped" id="shipped">
      <summary><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>Shipped<span class="c" id="shippedCount"></span></summary>
      <ul class="list" id="shippedList"></ul>

  <!-- MÅL -->

    <button class="btn ghost wide" id="newGoalBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nyt mål
    </button>

</main>

<div class="dock" id="dock">
  <div class="dock-in">
    <div class="tokens" id="tokens" aria-live="polite" hidden></div>
    <form class="capture" id="captureForm" autocomplete="off">
      <label for="captureInput" class="sr">Ny opgave</label>
      <span class="prompt" aria-hidden="true">&gt;</span>
      <input id="captureInput" type="text" enterkeyhint="done" autocapitalize="sentences" placeholder="Ny opgave… #projekt !imorgen">
      <button class="go" type="submit" aria-label="Tilføj opgave"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
  </div>
</div>

<nav class="tabbar" aria-label="Skærme">
  <div class="tabbar-in">
    <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
    <a class="tab" href="#kontrol" data-tab="kontrol" aria-label="Kontrol">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg><span class="lbl">Kontrol</span>
    </a>
    <a class="tab" href="#opgaver" data-tab="opgaver" aria-label="Opgaver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg><span class="lbl">Opgaver</span><span class="badge" id="overBadge" hidden></span>
    </a>
    <a class="tab" href="#maal" data-tab="maal" aria-label="Mål">

    </a>

<dialog class="sheet" id="goalSheet" aria-labelledby="gsTitle">
  <form class="sheet-in" id="goalEdit" method="dialog" autocomplete="off">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="gsTitle">Redigér mål</h2>
    <div class="field"><label for="eName">Navn</label><input id="eName" type="text" placeholder="Fx 20 demo-opkald" required></div>
    <div class="row2">
      <div class="field"><label for="eCur">Nu</label><input id="eCur" type="number" inputmode="numeric" min="0"></div>
      <div class="field"><label for="eTarget">Mål</label><input id="eTarget" type="number" inputmode="numeric" min="1"></div>
    </div>
    <div class="field"><label for="eDue">Deadline</label><input id="eDue" type="date"></div>
    <div class="sheet-actions">
      <button type="button" class="btn danger" id="gDelete">Slet</button>
      <button type="submit" class="btn primary" id="gSave" value="save">Gem</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="msg" id="toastMsg"></span><button type="button" id="toastAction" hidden>Fortryd</button></div>

<script>
(() => {
'use strict';
const KEY = 'missionControl.v1';
const FOCUS_MAX = 3;
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const touchy = matchMedia('(pointer: coarse)');
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const visible = sel => document.querySelector(`section.screen:not([hidden]) ${sel}`);

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = k => Math.round((parseKey(k) - parseKey(todayKey())) / 864e5);
const weekStart = () => { const d = new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return keyOf(d); };
const nextWeekday = wd => { const d = new Date().getDay(); return addDays(todayKey(), ((wd - d + 7) % 7) || 7); };
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const DAYS = ['søn','man','tir','ons','tor','fre','lør'];
function dueLabel(k) {
  const n = diffDays(k);
  if (n === 0) return 'i dag';
  if (n === 1) return 'i morgen';
  if (n === -1) return 'i går';
  if (n < 0) return `${-n} dage over`;
  const d = parseKey(k);
  if (n < 7) return `${DAYS[d.getDay()]} ${d.getDate()}. ${MONTHS[d.getMonth()]}`;
  return `${d.getDate()}. ${MONTHS[d.getMonth()]}`;
}
const tMinus = k => { const n = diffDays(k); return n >= 0 ? `T−${n}d` : `T+${-n}d`; };
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 864e5 + 1) / 7);
}

/* ---------- storage ---------- */
let storageOK = true;
function seed() {
  const t = todayKey(), now = Date.now();
  const mk = (text, project, extra = {}) => ({ id: uid(), text, project, due: null, focus: false, done: false, doneAt: null, createdAt: now, ...extra });
  return {
    v: 1,
    tasks: [
      mk('Agent skal svare: “Book tid til værkstedet på hjemmesiden”', 'bilhuset-lind', { focus: true, due: t }),
      mk('Tag telefonen ved intet svar i hverdagen', 'bilhuset-lind'),
      mk('Tool til tjek af biler på lager', 'bilhuset-lind'),
      mk('Håndtér fejlede opkald ordentligt', 'platform', { focus: true }),
      mk('Agent workspace', 'platform'),
      mk('SOP og knowledge base', 'platform'),
    ],
    goals: [{ id: uid(), name: '5 første kunder', current: 0, target: 5, due: null, main: true, createdAt: now }],
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.tasks) && Array.isArray(d.goals)) return d;
    }
  } catch (e) { storageOK = false; }
  return seed();
}
let state = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
  catch (e) {
    if (storageOK) toast('Kan ikke gemme på denne enhed. Ændringer forsvinder ved genindlæsning.', { warn: true });
    storageOK = false;
  }
}
function commit() { save(); render(); }

/* ---------- projects + parsing ---------- */
const projName = p => p ? p.split(/[-_]/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(' ') : 'Indbakke';
const projKey = s => s.trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '-');
const projects = () => [...new Set(state.tasks.map(t => t.project).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'da'));
function parseInput(raw) {
  let project = null, due = null;
  let s = ' ' + raw + ' ';
  s = s.replace(/(\s)#([\p{L}\p{N}_-]+)(?=\s)/gu, (m, sp, tag) => { if (!project) project = projKey(tag); return sp; });
  s = s.replace(/(\s)!(i-?dag|i-?morgen|(\d{1,2})[./](\d{1,2}))(?=\s)/giu, (m, sp, w, d, mo) => {
    const lw = w.toLowerCase().replace('-', '');
    if (lw === 'idag') due = todayKey();
    else if (lw === 'imorgen') due = addDays(todayKey(), 1);
    else {
      const y = new Date().getFullYear();
      let dt = new Date(y, Number(mo) - 1, Number(d));
      if (dt.getMonth() !== Number(mo) - 1) return m;
      if (keyOf(dt) < todayKey()) dt = new Date(y + 1, Number(mo) - 1, Number(d));
      due = keyOf(dt);
    }
    return sp;
  });
  return { text: s.replace(/\s+/g, ' ').trim(), project, due };
}

/* ---------- task actions ---------- */
const openFocus = () => state.tasks.filter(t => t.focus && !t.done);
const findTask = id => state.tasks.find(t => t.id === id);
let freshId = null;
function addTask(raw) {
  const p = parseInput(raw);
  if (!p.text) { toast('Skriv lidt tekst før du trykker enter.'); return false; }
  const t = { id: uid(), text: p.text, project: p.project, due: p.due, focus: false, done: false, doneAt: null, createdAt: Date.now() };
  state.tasks.push(t);
  freshId = t.id;
  commit();
  freshId = null;
  return true;
}
function toggleFocus(id) {
  const t = findTask(id); if (!t) return;
  if (!t.focus && openFocus().length >= FOCUS_MAX) {
    toast('Dagens fokus er fuld (3/3). Fjern en stjerne først, så der er plads.');
    buzz([10, 40, 10]);
    return;
  }
  t.focus = !t.focus;
  buzz(6);
  commit();
}
function completeTask(id, li) {
  const t = findTask(id); if (!t || (li && li.classList.contains('closing'))) return;
  if (t.done) { t.done = false; t.doneAt = null; commit(); return; }
  if (editingId === id) editingId = null;
  const before = { focus: t.focus };
  const timers = [];
  let finished = false;
  const finish = () => {
    finished = true;
    t.done = true; t.doneAt = Date.now(); t.focus = false;
    commit();
    const c = $('#shippedCount'); c.classList.remove('bump'); c.getBoundingClientRect(); c.classList.add('bump');
  };
  // undo is offered immediately, also while the closing animation runs
  toast(`Shipped: ${t.text}`, { action: 'Fortryd', onAction: () => {
    timers.forEach(clearTimeout);
    if (!finished) { render(); return; }
    t.done = false; t.doneAt = null; t.focus = before.focus && openFocus().length < FOCUS_MAX;
    commit();
  } });
  buzz(10);
  if (!li || reduced.matches) return finish();
  li.classList.add('closing');
  timers.push(setTimeout(() => {
    li.style.height = li.offsetHeight + 'px'; li.getBoundingClientRect();
    li.classList.add('collapsing'); li.style.height = '0px';
  }, 520));
  timers.push(setTimeout(finish, 760));
}
function deleteTask(id) {
  const i = state.tasks.findIndex(t => t.id === id); if (i < 0) return;
  const [t] = state.tasks.splice(i, 1);
  if (editingId === id) editingId = null;
  commit();
  toast('Opgave slettet.', { action: 'Fortryd', onAction: () => { state.tasks.splice(i, 0, t); commit(); } });
}

/* ---------- goal actions ---------- */
const mainGoal = () => state.goals.find(g => g.main);
let burstId = null;
function stepGoal(id, delta) {
  const g = state.goals.find(x => x.id === id); if (!g) return;
  const before = g.current;
  g.current = Math.max(0, g.current + delta);
  if (g.current === before) return;
  if (before < g.target && g.current >= g.target) { burstId = g.id; toast(`Mål nået: ${g.name}`); buzz([12, 60, 24]); }
  else buzz(6);
  commit();
}
function setMain(id) { state.goals.forEach(g => { g.main = g.id === id; }); commit(); }

/* ---------- icons ---------- */
const I = {
  check: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#021016" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  star: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  plus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>',
  target: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>',
  ok: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
};

/* ---------- render: task row ---------- */
let editingId = null;
const DUE_OPTS = () => [
  ['I dag', todayKey()], ['I morgen', addDays(todayKey(), 1)], ['Fre', nextWeekday(5)], ['Næste uge', nextWeekday(1)],
];
function editor(t) {
  const opts = DUE_OPTS();
  const custom = t.due && !opts.some(o => o[1] === t.due);
  const ps = projects();
  return `<div class="editor">
    ${t.done ? '' : `<div class="ed-row"><span class="ed-label">Deadline</span><div class="chipset">
      ${opts.map(([l, k]) => `<button type="button" class="chip" data-due="${k}" aria-pressed="${t.due === k}">${l}</button>`).join('')}
      <label class="chip" aria-pressed="${!!custom}">${custom ? dueLabel(t.due) : 'Dato…'}<input type="date" data-due-input value="${t.due || ''}" aria-label="Vælg dato"></label>
      ${t.due ? `<button type="button" class="chip" data-due="">Ingen</button>` : ''}
    </div></div>`}
    <div class="ed-row"><span class="ed-label">Projekt</span><div class="chipset">
      ${ps.map(p => `<button type="button" class="chip proj" data-proj="${esc(p)}" aria-pressed="${t.project === p}">#${esc(p)}</button>`).join('')}
      <button type="button" class="chip proj" data-proj="" aria-pressed="${!t.project}">Indbakke</button>
    </div></div>
    <div class="ed-actions">
      <button type="button" class="btn danger sm" data-act="delete">${I.trash}Slet</button>
      <button type="button" class="btn ghost sm" data-act="close">Færdig</button>
    </div>
  </div>`;
}
function taskRow(t, { showProject = false } = {}) {
  const editing = editingId === t.id;
  const meta = [];
  if (showProject && t.project) meta.push(`<span class="proj">#${esc(t.project)}</span>`);
  let over = false;
  if (t.due && !t.done) {
    const n = diffDays(t.due); over = n < 0;
    meta.push(`<span class="${over ? 'over' : n === 0 ? 'today' : ''}">${dueLabel(t.due)}</span>`);
  }
  if (t.done && t.doneAt) { const d = new Date(t.doneAt); meta.push(`<span>shipped ${d.getDate()}. ${MONTHS[d.getMonth()]}</span>`); }
  const body = editing
    ? `<textarea class="ed-text" rows="1" aria-label="Opgavetekst" enterkeyhint="done">${esc(t.text)}</textarea>`
    : `<div class="body" role="button" tabindex="0" data-act="edit" aria-label="Redigér: ${esc(t.text)}"><span class="txt">${esc(t.text)}</span><span class="meta">${meta.join('')}</span></div>`;
  return `<li class="task${t.done ? ' done' : ''}${over ? ' overdue' : ''}${editing ? ' editing' : ''}${t.id === freshId ? ' fresh' : ''}" data-id="${t.id}">
    <div class="swipe-bg" aria-hidden="true"></div>
    <div class="task-in">
      <button class="check" type="button" data-act="done" aria-label="${t.done ? 'Genåbn' : 'Markér som færdig'}: ${esc(t.text)}"><span class="c">${I.check}</span></button>
      ${body}
      ${t.done ? '' : `<button class="star" type="button" data-act="focus" aria-pressed="${t.focus}" aria-label="Dagens fokus">${I.star}</button>`}
    </div>
    ${editing ? editor(t) : ''}
  </li>`;
}
function sortTasks(a, b) {
  if (a.focus !== b.focus) return a.focus ? -1 : 1;
  if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
  if (!!a.due !== !!b.due) return a.due ? -1 : 1;
  return a.createdAt - b.createdAt;
}

/* ---------- render: segmented ring ---------- */
function arc(r, a0, a1) {
  const x = a => (60 + r * Math.cos(a)).toFixed(2), y = a => (60 + r * Math.sin(a)).toFixed(2);
  return `M${x(a0)} ${y(a0)}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x(a1)} ${y(a1)}`;
}
const prevVals = new Map();
function ringSVG(g, prev) {
  const n = g.target, cur = Math.min(g.current, n);
  if (n >= 2 && n <= 12) {
    const step = Math.PI * 2 / n, gap = 0.34;
    let out = '';
    for (let i = 0; i < n; i++) {
      const a0 = -Math.PI / 2 + i * step + gap / 2, a1 = a0 + step - gap;
      const on = i < cur, pop = on && prev != null && i >= prev;
      out += `<path class="seg ${on ? 'on' : 'off'}${pop ? ' pop' : ''}" d="${arc(50, a0, a1)}"/>`;
    }
    return out;
  }
  const pct = n > 0 ? cur / n : 0;
  return `<circle class="seg off" cx="60" cy="60" r="50"/>${pct > 0 ? `<circle class="ring-bar" cx="60" cy="60" r="50" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - pct * 100}" transform="rotate(-90 60 60)"/>` : ''}`;
}
const odo = (v, prev) => `<span class="odo${prev != null && prev !== v && !reduced.matches ? (v > prev ? ' up' : ' down') : ''}"><span>${v}</span></span>`;

/* ---------- render: screens ---------- */
function renderKontrol() {
  const g = mainGoal();
  const hero = $('#heroPanel');
  if (g) {
    const prev = prevVals.get('hero:' + g.id);
    const pct = g.target > 0 ? Math.min(1, g.current / g.target) : 0;
    const over = g.due && g.current < g.target && diffDays(g.due) < 0;
    hero.innerHTML = `
      <div class="ring">
        <svg viewBox="0 0 120 120" role="img" aria-label="${esc(g.name)}: ${g.current} af ${g.target}">${ringSVG(g, prev)}</svg>
        <div class="ring-center"><div class="ring-val">${odo(g.current, prev)}<small>/${g.target}</small></div><div class="ring-pct">${Math.round(pct * 100)}%</div></div>
      </div>
      <div class="hero-side">
        <span class="eyebrow">Hovedmål</span>
        <span class="hero-name">${esc(g.name)}</span>
        ${g.due ? `<span class="tminus${over ? ' over' : ''}">${tMinus(g.due)} · ${dueLabel(g.due)}</span>` : ''}
        <div class="stepper">
          <button class="step minus" type="button" data-goal="${g.id}" data-d="-1" aria-label="Træk én fra">${I.minus}</button>
          <button class="step" type="button" data-goal="${g.id}" data-d="1" aria-label="Læg én til">${I.plus}</button>
        </div>
      </div>`;
    prevVals.set('hero:' + g.id, g.current);
  } else {
    hero.innerHTML = `<div class="empty" style="grid-column:1/-1;padding:4px"><strong>Intet hovedmål valgt</strong>Gør et mål til hovedmål, så lyser det op her. <a class="link" href="#maal">Gå til Mål</a></div>`;
  }

  const t0 = todayKey(), w0 = weekStart();
  const doneKeys = state.tasks.filter(t => t.done && t.doneAt).map(t => keyOf(new Date(t.doneAt)));
  const over = state.tasks.filter(t => !t.done && t.due && diffDays(t.due) < 0).length;
  $('#stats').innerHTML = `
    <div><div class="n">${doneKeys.filter(k => k === t0).length}</div><div class="l">Lukket i dag</div></div>
    <div><div class="n">${doneKeys.filter(k => k >= w0).length}</div><div class="l">Denne uge</div></div>
    <div class="${over ? 'warn' : ''}"><div class="n">${over}</div><div class="l">Overskredet</div></div>`;

  const f = openFocus().sort(sortTasks);
  $('#focusCount').textContent = `${f.length}/${FOCUS_MAX}`;
  $('#focusList').innerHTML = f.length ? f.map(t => taskRow(t, { showProject: true })).join('')
    : `<li class="empty"><strong>Ingen fokus endnu</strong>Tryk på stjernen ud for op til tre opgaver under <a class="link" href="#opgaver">Opgaver</a>.</li>`;
}

function renderOpgaver() {
  const open = state.tasks.filter(t => !t.done);
  const done = state.tasks.filter(t => t.done).sort((a, b) => b.doneAt - a.doneAt);
  $('#openCount').textContent = `${open.length} åbne`;
  const groups = new Map();
  open.forEach(t => { const k = t.project || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
  const keys = [...groups.keys()].sort((a, b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b, 'da'));
  $('#groups').innerHTML = keys.length ? keys.map(k => {
    const list = groups.get(k).sort(sortTasks);
    return `<section class="panel" aria-label="${esc(projName(k))}">
      <div class="panel-head"><span class="dot${k ? '' : ' inbox'}"></span><span>${esc(projName(k))}</span><span class="c">${list.length}</span></div>
      <ul class="list">${list.map(t => taskRow(t)).join('')}</ul>
    </section>`;
  }).join('') : `<div class="panel empty"><strong>Alt er lukket</strong>Skriv næste opgave i feltet nederst og tryk enter.</div>`;

  $('#shippedCount').textContent = done.length;
  $('#shippedList').innerHTML = done.length ? done.map(t => taskRow(t, { showProject: true })).join('')
    : `<li class="empty">Intet shipped endnu. Tryk på cirklen, eller swipe til højre, når en opgave er klaret.</li>`;
}

function renderMaal() {
  const gs = state.goals;
  $('#goalCount').textContent = gs.length ? `${gs.filter(g => g.current >= g.target).length}/${gs.length} nået` : '';
  $('#goalList').innerHTML = gs.length ? gs.map(g => {
    const prev = prevVals.get('goal:' + g.id);
    const pct = g.target > 0 ? Math.min(1, g.current / g.target) : 0;
    const reached = g.current >= g.target;
    const over = g.due && !reached && diffDays(g.due) < 0;
    let bar;
    if (g.target >= 2 && g.target <= 12) {
      bar = `<div class="segs" style="--n:calc(${g.target * 100}% + ${(g.target - 1) * 4}px)">${Array.from({ length: g.target }, (_, i) => {
        const on = i < g.current, pop = on && prev != null && i >= prev && !reduced.matches;
        return `<i class="${on ? 'on' : ''}${pop ? ' pop' : ''}" style="background-position:${(i / (g.target - 1)) * 100}% 0"></i>`;
      }).join('')}</div>`;
    } else {
      const pp = prev != null ? Math.min(1, prev / g.target) : pct;
      bar = `<div class="bar"><i style="transform:scaleX(${pp})" data-to="${pct}"></i></div>`;
    }
    prevVals.set('goal:' + g.id, g.current);
    return `<article class="goal${g.main ? ' main' : ''}" data-goal-id="${g.id}">
      <div class="goal-top">
        <button class="goal-name" type="button" data-edit-goal="${g.id}" aria-label="Redigér mål: ${esc(g.name)}">${esc(g.name)}</button>
        <div class="goal-val">${odo(g.current, prev)}<small>/${g.target}</small></div>
      </div>
      <div role="progressbar" aria-valuemin="0" aria-valuemax="${g.target}" aria-valuenow="${g.current}" aria-label="${esc(g.name)}">${bar}</div>
      <div class="goal-foot">
        <span class="info">${g.due ? `<span class="tminus${over ? ' over' : ''}">${tMinus(g.due)}</span>` : ''}<span>${Math.round(pct * 100)}%</span></span>
        ${reached ? `<span class="pill reached">Nået</span>` : ''}
        <button class="pill" type="button" data-main="${g.id}" aria-pressed="${!!g.main}">${I.target}${g.main ? 'Hovedmål' : 'Gør til hovedmål'}</button>
        <div class="stepper">
          <button class="step sm minus" type="button" data-goal="${g.id}" data-d="-1" aria-label="Træk én fra ${esc(g.name)}">${I.minus}</button>
          <button class="step sm" type="button" data-goal="${g.id}" data-d="1" aria-label="Læg én til ${esc(g.name)}">${I.plus}</button>
        </div>
      </div>
    </article>`;
  }).join('') : `<div class="empty"><strong>Ingen mål endnu</strong>Tilføj et mål med en målværdi, fx 5 første kunder.</div>`;
  requestAnimationFrame(() => document.querySelectorAll('#goalList .bar i[data-to]').forEach(i => { i.style.transform = `scaleX(${i.dataset.to})`; }));
}

function render() {
  renderKontrol(); renderOpgaver(); renderMaal();
  const over = state.tasks.filter(t => !t.done && t.due && diffDays(t.due) < 0).length;
  const b = $('#overBadge'); b.hidden = !over; b.textContent = over;
  const d = new Date();
  $('#stamp').textContent = `${DAYS[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth() + 1)} · U${isoWeek(d)}`;
  if (burstId) {
    const id = burstId; burstId = null;
    const targets = [document.querySelector(`[data-goal-id="${id}"]`)];
    if (mainGoal() && mainGoal().id === id) targets.push($('#heroPanel'));
    targets.filter(Boolean).forEach(el => { el.classList.add('burst'); setTimeout(() => el.classList.remove('burst'), 1000); });
  }
  const ta = visible('.task.editing .ed-text');
  if (ta) autosize(ta);
}
function autosize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

/* ---------- toast ---------- */
let toastTimer, toastCb;
function toast(msg, { action, onAction, warn } = {}) {
  const el = $('#toast'), btn = $('#toastAction');
  $('#toastMsg').textContent = msg;
  el.classList.toggle('warn', !!warn);
  btn.hidden = !action; btn.textContent = action || '';
  toastCb = onAction || null;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), action ? 5000 : 2600);
}
$('#toastAction').addEventListener('click', () => { const cb = toastCb; toastCb = null; $('#toast').classList.remove('show'); if (cb) cb(); });

/* ---------- routing + sliding tab pill ---------- */
const TABS = ['kontrol', 'opgaver', 'maal'];
let curTab = null;
function route() {
  const h = location.hash.replace('#', '');
  const cur = TABS.includes(h) ? h : 'kontrol';
  if (editingId) { saveEditText(); editingId = null; render(); }
  TABS.forEach(t => {
    const s = $('#screen-' + t), show = t === cur;
    s.hidden = !show;
    if (show && curTab && curTab !== cur) { s.classList.remove('enter'); s.getBoundingClientRect(); s.classList.add('enter'); }
  });
  document.querySelectorAll('.tab').forEach(a => { if (a.dataset.tab === cur) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#tabInd').style.transform = `translateX(${TABS.indexOf(cur) * 100}%)`;
  document.body.classList.toggle('no-dock', cur === 'maal');
  if (curTab && curTab !== cur) window.scrollTo(0, 0);
  curTab = cur;
  measureStack();
}
addEventListener('hashchange', route);

/* ---------- dock: capture + live tokens + keyboard ---------- */
const input = $('#captureInput'), tokens = $('#tokens');
function partialTag() {
  const pos = input.selectionStart ?? input.value.length;
  const m = input.value.slice(0, pos).match(/(?:^|\s)#([\p{L}\p{N}_-]*)$/u);
  return m ? m[1].toLowerCase() : null;
}
function renderTokens() {
  const p = parseInput(input.value), part = partialTag();
  const out = [];
  if (part !== null) {
    const sugg = projects().filter(x => x.startsWith(part) && x !== part).slice(0, 6);
    sugg.forEach(x => out.push(`<button type="button" class="chip proj" data-sugg="${esc(x)}">#${esc(x)}</button>`));
    if (part && !sugg.length && !projects().includes(part)) out.push(`<span class="tok new">nyt projekt #${esc(part)}</span>`);
  }
  if (p.project && part === null) out.push(`<span class="tok p">#${esc(p.project)}</span>`);
  if (p.due) out.push(`<span class="tok d">${dueLabel(p.due)}</span>`);
  tokens.innerHTML = out.join('');
  tokens.hidden = !out.length;
}
input.addEventListener('input', renderTokens);
input.addEventListener('keyup', e => { if (e.key.startsWith('Arrow')) renderTokens(); });
tokens.addEventListener('pointerdown', e => { if (e.target.closest('[data-sugg]')) e.preventDefault(); });
tokens.addEventListener('click', e => {
  const s = e.target.closest('[data-sugg]'); if (!s) return;
  const pos = input.selectionStart ?? input.value.length;
  const before = input.value.slice(0, pos).replace(/#[\p{L}\p{N}_-]*$/u, '#' + s.dataset.sugg + ' ');
  input.value = before + input.value.slice(pos).replace(/^\s+/, '');
  input.focus(); input.setSelectionRange(before.length, before.length);
  renderTokens();
});
$('#captureForm').addEventListener('submit', e => {
  e.preventDefault();
  if (addTask(input.value)) {
    input.value = ''; renderTokens();
    if (curTab !== 'opgaver') toast('Tilføjet til Opgaver.');
  }
  input.focus();
});
input.addEventListener('focus', () => { if (touchy.matches) document.body.classList.add('typing'); });
input.addEventListener('blur', () => setTimeout(() => {
  if (document.activeElement !== input) { document.body.classList.remove('typing'); setKb(0); measureStack(); }
}, 60));
function setKb(px) { document.documentElement.style.setProperty('--kb', Math.max(0, Math.round(px)) + 'px'); }
if (window.visualViewport) {
  const vv = window.visualViewport;
  const onVV = () => { if (document.body.classList.contains('typing')) setKb(innerHeight - vv.height - vv.offsetTop); };
  vv.addEventListener('resize', onVV); vv.addEventListener('scroll', onVV);
}
function measureStack() {
  if (document.body.classList.contains('typing')) return;
  const dock = $('#dock'), tab = document.querySelector('.tabbar');
  const top = getComputedStyle(dock).display !== 'none' ? dock.querySelector('.dock-in').getBoundingClientRect().top - 8 : tab.getBoundingClientRect().top;
  document.documentElement.style.setProperty('--stack-h', Math.max(64, innerHeight - top) + 'px');
}
addEventListener('resize', measureStack);

/* ---------- inline editing ---------- */
function saveEditText() {
  const t = findTask(editingId); if (!t) return;
  const ta = visible('.task.editing .ed-text') || document.querySelector('.task.editing .ed-text');
  if (!ta) return;
  const p = parseInput(ta.value);
  if (p.text) t.text = p.text;
  if (p.project) t.project = p.project;
  if (p.due) t.due = p.due;
  save();
}
function startEdit(id) {
  if (editingId && editingId !== id) saveEditText();
  editingId = id;
  render();
  const ta = visible('.task.editing .ed-text');
  if (ta) {
    autosize(ta);
    ta.focus({ preventScroll: true });
    ta.setSelectionRange(ta.value.length, ta.value.length);
    ta.closest('.task').scrollIntoView({ block: 'nearest', behavior: reduced.matches ? 'auto' : 'smooth' });
  }
}
function stopEdit() { if (!editingId) return; saveEditText(); editingId = null; commit(); }
document.addEventListener('input', e => { if (e.target.matches('.ed-text')) autosize(e.target); });
document.addEventListener('keydown', e => {
  if (e.target.matches('.ed-text')) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); stopEdit(); }
    else if (e.key === 'Escape') { editingId = null; render(); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.body[data-act="edit"]')) { e.preventDefault(); startEdit(e.target.closest('.task').dataset.id); }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-due-input]')) {
    const t = findTask(editingId); if (!t) return;
    saveEditText(); t.due = e.target.value || null; commit();
  }
});

/* ---------- clicks ---------- */
let suppressClick = false;
function handleClick(e) {
  const dueBtn = e.target.closest('[data-due]');
  if (dueBtn) { const t = findTask(editingId); if (t) { saveEditText(); t.due = dueBtn.dataset.due || null; commit(); } return true; }
  const dateChip = e.target.closest('label.chip');
  if (dateChip) { const inp = dateChip.querySelector('input'); if (e.target !== inp) { try { inp.showPicker(); } catch (err) {} } return true; }
  const projBtn = e.target.closest('[data-proj]');
  if (projBtn) { const t = findTask(editingId); if (t) { saveEditText(); t.project = projBtn.dataset.proj || null; commit(); } return true; }
  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    const li = actEl.closest('.task'); const id = li.dataset.id;
    const act = actEl.dataset.act;
    if (act === 'done') completeTask(id, li);
    else if (act === 'focus') toggleFocus(id);
    else if (act === 'edit') startEdit(id);
    else if (act === 'delete') deleteTask(id);
    else if (act === 'close') stopEdit();
    return true;
  }
  const step = e.target.closest('[data-goal][data-d]');
  if (step) { stepGoal(step.dataset.goal, Number(step.dataset.d)); return true; }
  const m = e.target.closest('[data-main]');
  if (m) { if (!state.goals.find(x => x.id === m.dataset.main).main) { setMain(m.dataset.main); toast('Hovedmål vises nu på Kontrol.'); } return true; }
  const eg = e.target.closest('[data-edit-goal]');
  if (eg) { openGoalSheet(eg.dataset.editGoal); return true; }
  return false;
}
document.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); e.stopPropagation(); return; }
  let closed = false;
  // tapping anywhere outside the row being edited saves and closes the editor
  if (editingId && !e.target.closest('.task.editing') && !e.target.closest('#toast')) {
    saveEditText(); editingId = null; closed = true;
  }
  const handled = handleClick(e);
  if (closed && !handled) commit();
}, true);

/* ---------- gestures: swipe right = done, left = delete, long-press = edit ---------- */
let g = null;
const THRESH = li => Math.min(110, li.offsetWidth * 0.3);
document.addEventListener('pointerdown', e => {
  const li = e.target.closest('.task'); if (!li || e.button > 0 || li.classList.contains('editing') || li.classList.contains('closing')) return;
  if (e.target.closest('.check,.star')) return;
  g = { li, id: li.dataset.id, x: e.clientX, y: e.clientY, dx: 0, mode: null, pid: e.pointerId, armed: false };
  li.classList.add('pressing');
  g.timer = setTimeout(() => {
    if (!g || g.mode) return;
    g.mode = 'long'; li.classList.remove('pressing');
    suppressClick = true; buzz(12);
    startEdit(g.id);
  }, 480);
});
document.addEventListener('pointermove', e => {
  if (!g || e.pointerId !== g.pid || g.mode === 'long') return;
  const dx = e.clientX - g.x, dy = e.clientY - g.y;
  if (!g.mode) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) {
      g.mode = 'swipe'; g.li.classList.add('dragging'); clearTimeout(g.timer); g.li.classList.remove('pressing');
    } else if (Math.abs(dy) > 10) { cancelGesture(); return; }
    else return;
  }
  const done = g.li.classList.contains('done');
  let d = done ? Math.min(0, dx) : dx;
  const th = THRESH(g.li);
  if (Math.abs(d) > th) d = Math.sign(d) * (th + (Math.abs(d) - th) * 0.35);
  g.dx = d;
  const dir = d > 0 ? 'right' : 'left';
  if (g.li.dataset.dir !== dir) {
    g.li.dataset.dir = dir;
    g.li.querySelector('.swipe-bg').innerHTML = dir === 'right' ? `${I.ok}<span>Færdig</span>` : `<span>Slet</span>${I.trash}`;
  }
  const armed = Math.abs(d) >= th;
  if (armed !== g.armed) { g.armed = armed; g.li.classList.toggle('armed', armed); if (armed) buzz(8); }
  g.li.querySelector('.task-in').style.transform = `translateX(${d}px)`;
});
function endGesture(e) {
  if (!g || (e && e.pointerId !== g.pid)) return;
  clearTimeout(g.timer);
  const { li, mode, dx, id, armed } = g;
  g = null;
  li.classList.remove('pressing', 'armed');
  if (mode === 'long') { setTimeout(() => { suppressClick = false; }, 80); return; }
  if (mode !== 'swipe') return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 80);
  const inner = li.querySelector('.task-in');
  li.classList.remove('dragging');
  if (armed && dx < 0) {
    li.classList.add('swiped'); inner.style.transform = 'translateX(-105%)';
    setTimeout(() => deleteTask(id), reduced.matches ? 0 : 180);
  } else {
    inner.style.transform = '';
    if (armed && dx > 0) completeTask(id, li);
  }
}
function cancelGesture() {
  if (!g) return; clearTimeout(g.timer);
  g.li.classList.remove('pressing', 'dragging', 'armed'); g.li.querySelector('.task-in').style.transform = ''; g = null;
}
document.addEventListener('pointerup', endGesture);
document.addEventListener('pointercancel', cancelGesture);
document.addEventListener('contextmenu', e => { if (e.target.closest('.task:not(.editing)')) e.preventDefault(); });

/* ---------- goal sheet (create + edit) ---------- */
let editingGoal = null;
const goalSheet = $('#goalSheet');
function openSheet(d) { try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } }
function openGoalSheet(id) {
  const gl = id ? state.goals.find(x => x.id === id) : null;
  editingGoal = gl ? gl.id : null;
  $('#gsTitle').textContent = gl ? 'Redigér mål' : 'Nyt mål';
  $('#gSave').textContent = gl ? 'Gem' : 'Tilføj mål';
  $('#gDelete').hidden = !gl;
  $('#eName').value = gl ? gl.name : '';
  $('#eCur').value = gl ? gl.current : 0;
  $('#eTarget').value = gl ? gl.target : 10;
  $('#eDue').value = gl && gl.due ? gl.due : '';
  openSheet(goalSheet);
  if (!gl) setTimeout(() => $('#eName').focus(), 50);
}
$('#newGoalBtn').addEventListener('click', () => openGoalSheet(null));
$('#goalEdit').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#eName').value.trim(); if (!name) { $('#eName').focus(); return; }
  const target = Math.max(1, parseInt($('#eTarget').value, 10) || 1);
  const current = Math.max(0, parseInt($('#eCur').value, 10) || 0);
  const due = $('#eDue').value || null;
  let gl = state.goals.find(x => x.id === editingGoal);
  if (gl) {
    if (gl.current < target && current >= target) burstId = gl.id;
    Object.assign(gl, { name, target, current, due });
  } else {
    gl = { id: uid(), name, current, target, due, main: !mainGoal(), createdAt: Date.now() };
    state.goals.push(gl);
    toast(`Mål tilføjet: ${name}`);
  }
  goalSheet.close(); commit();
});
$('#gDelete').addEventListener('click', () => {
  const i = state.goals.findIndex(x => x.id === editingGoal); if (i < 0) return;
  const [gl] = state.goals.splice(i, 1);
  goalSheet.close(); commit();
  toast('Mål slettet.', { action: 'Fortryd', onAction: () => { state.goals.splice(i, 0, gl); commit(); } });
});
goalSheet.addEventListener('click', e => { if (e.target === goalSheet) goalSheet.close(); });

/* ---------- home-screen icon (generated PNG) ---------- */
try {
  const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d');
  x.fillStyle = '#05070D'; x.fillRect(0, 0, 180, 180);
  x.strokeStyle = 'rgba(0,229,255,.10)'; x.lineWidth = 1;
  for (let i = 0; i <= 180; i += 18) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 180); x.moveTo(0, i); x.lineTo(180, i); x.stroke(); }
  x.lineCap = 'round'; x.lineWidth = 13;
  const gr = x.createLinearGradient(30, 30, 150, 150); gr.addColorStop(0, '#8B5CF6'); gr.addColorStop(1, '#00E5FF');
  for (let i = 0; i < 5; i++) {
    const a0 = -Math.PI / 2 + i * (Math.PI * 2 / 5) + 0.3, a1 = a0 + Math.PI * 2 / 5 - 0.6;
    x.shadowBlur = i < 3 ? 16 : 0; x.shadowColor = '#00E5FF';
    x.strokeStyle = i < 3 ? gr : 'rgba(0,229,255,.16)';
    x.beginPath(); x.arc(90, 90, 52, a0, a1); x.stroke();
  }
  x.shadowBlur = 14; x.fillStyle = '#00E5FF'; x.beginPath(); x.arc(90, 90, 9, 0, Math.PI * 2); x.fill();
  const png = c.toDataURL('image/png');
  $('#touchIcon').href = png;
  const manifest = { name: 'Mission Control', short_name: 'Mission', display: 'standalone', background_color: '#05070D', theme_color: '#05070D', start_url: location.href.split('#')[0], icons: [{ src: png, sizes: '180x180', type: 'image/png' }] };
  const l = document.createElement('link'); l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  document.head.appendChild(l);
} catch (e) {}

/* ---------- boot ---------- */
render(); route(); save();
if (window.ResizeObserver) new ResizeObserver(measureStack).observe($('#dock'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureStack);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !editingId) render(); });
})();
</script>
</body>
